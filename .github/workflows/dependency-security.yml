name: Dependency security

on:
  push:
    branches: [main]
  schedule:
    - cron: '35 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Build the program and install reactor dependencies
        run: mvn -B -ntp -DskipTests install
      - name: Submit resolved dependencies including test libraries
        uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c # v6.0.1
        with:
          correlator: reactor
      - name: Build the standalone data builder
        run: mvn -B -ntp -f xivdata/databuilder/pom.xml verify
      - name: Submit data builder dependencies
        uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c # v6.0.1
        with:
          directory: xivdata/databuilder
          correlator: databuilder
