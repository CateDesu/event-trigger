# This workflow builds the program, and publishes it to github-pages, under a per-branch directory.
# e.g. master branch builds to https://xpdota.github.io/event-trigger/master/

name: Publish

on:
  workflow_dispatch:


jobs:
  build:

    if: github.ref_name != 'gh-pages'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Install display dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Build with Maven
        run: xvfb-run -a mvn -B -ntp -T3 clean install
      - name: Copy release files
        run: |
          pushd launcher/target/windows/
          mkdir -p publish_data/v2
          md5sum *.exe *.dll deps/*.jar > publish_data/v2/manifest
          cp -r *.exe *.dll deps/ publish_data/v2/
          popd
      - name: Docs with Maven
        run: mvn site
      - name: Copy docs
        run: |
          mv target/site/apidocs ./launcher/target/windows/publish_data/javadoc
      - name: Deploy release files
        uses: JamesIves/github-pages-deploy-action@4.1.7

        with:
          folder: ./launcher/target/windows/publish_data
          branch: gh-pages
          target-folder: ${{ github.ref_name }}





