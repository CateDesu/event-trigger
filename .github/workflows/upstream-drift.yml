# Report upstream drift in the run summary. Sync stays manual.
name: Upstream drift

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    if: github.repository == 'CateDesu/event-trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch upstream master
        run: |
          git fetch --no-tags https://github.com/xpdota/event-trigger.git \
            +refs/heads/master:refs/remotes/upstream/master
      - name: Report drift
        run: |
          behind=$(git rev-list --count HEAD..upstream/master)
          fork_ref=$(git rev-parse HEAD)
          upstream_ref=$(git rev-parse upstream/master)
          message="main is $behind commits behind xpdota/event-trigger master"
          echo "$message"
          {
            echo "$message"
            echo
            echo "[Compare upstream changes](https://github.com/xpdota/event-trigger/compare/$fork_ref...$upstream_ref)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$behind" -gt 0 ]; then
            echo "::warning::$message"
          fi
