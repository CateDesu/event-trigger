name: Callout regressions

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Install display dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Verify callout pipeline
        run: |
          xvfb-run -a mvn -q -pl :trigger-support,:triggers-dt -am \
            '-Dtest=MonitoringEventDistributorTest,Sequential*Test,Dmu*Test,CrossFightFaultInjectionTest,M1sTest,M2sTest,FRUTest' \
            -Dsurefire.failIfNoSpecifiedTests=false clean test
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path('.')
          reports = [report for folder in ("xivsupport", "trigger-support", "triggers/triggers-dt")
                     for report in (root / folder / "target/surefire-reports").glob("TEST-*.xml")]
          ran = {case.get("classname") for report in reports for case in ET.parse(report).iter("testcase")
                 if case.find("skipped") is None}
          required = {"gg.xp.reevent.events.MonitoringEventDistributorTest",
                      "gg.xp.xivsupport.events.triggers.seq.SequentialTriggerLifecycleTest",
                      "gg.xp.xivsupport.events.triggers.util.CrossFightFaultInjectionTest"}
          if required - ran:
              raise SystemExit(f"Missing native regressions: {sorted(required - ran)}")
          print("Required native regression classes ran")
          PY
